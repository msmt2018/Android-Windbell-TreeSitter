name: Publish Maven to JitPack

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_REVISION: '29.0.14206865'
  ANDROID_CMAKE_VERSION: '3.31.6'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  MAVEN_GROUP_PATH: com/github/msmt2018/Android-Windbell-TreeSitter

jobs:
  publish:
    name: Build and publish all Maven modules to JitPack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Generate release version automatically
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=7 HEAD)"
          date_utc="$(date -u +%Y%m%d)"
          base_version="$date_utc-$short_commit"

          # Reuse an existing release tag only when it points to this exact commit.
          existing_tag="$(
            git ls-remote --tags origin "refs/tags/${base_version}*" |
              awk -v commit="$commit" '
                /\^\{\}$/ && $1 == commit {
                  sub(/\^\{\}$/, "", $2)
                  sub(/^refs\/tags\//, "", $2)
                  print $2
                  exit
                }
              '
          )"

          if [[ -n "$existing_tag" ]]; then
            release_version="$existing_tag"
            echo "Reusing existing tag for current commit: $release_version"
          else
            release_version="$base_version"
            suffix=2
            while git ls-remote --exit-code --tags origin "refs/tags/$release_version" >/dev/null 2>&1; do
              release_version="$base_version-$suffix"
              suffix=$((suffix + 1))
            done
          fi

          if [[ ! "$release_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Generated invalid Maven release version: $release_version"
            exit 1
          fi

          echo "VERSION=$release_version" >> "$GITHUB_ENV"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android NDK, CMake and Build Tools
        timeout-minutes: 90
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not configured"
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "ndk;$ANDROID_NDK_REVISION" \
            "cmake;$ANDROID_CMAKE_VERSION" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

          ndk_path="$sdk_root/ndk/$ANDROID_NDK_REVISION"
          ndk_revision="$(sed -n 's/^Pkg.Revision = //p' "$ndk_path/source.properties" | head -n 1)"
          if [[ "$ndk_revision" != "$ANDROID_NDK_REVISION" ]]; then
            echo "::error::Expected NDK $ANDROID_NDK_REVISION, received $ndk_revision"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
          echo "$sdk_root/cmake/$ANDROID_CMAKE_VERSION/bin" >> "$GITHUB_PATH"
          "$sdk_root/cmake/$ANDROID_CMAKE_VERSION/bin/cmake" --version
          "$sdk_root/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" version

      - name: Install native build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local max_attempts=5 attempt=1 delay=10
            while (( attempt <= max_attempts )); do
              if "$@"; then return 0; fi
              if (( attempt == max_attempts )); then
                echo "::error::Command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "::warning::Attempt $attempt/$max_attempts failed; retrying in $delay seconds"
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends build-essential cargo nodejs npm cmake ninja-build

      - name: Set up Python for native grammar builds
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for native grammar bindings
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Set up Bun for grammar packages
        uses: oven-sh/setup-bun@v2

      - name: Install Node packages for all grammar submodules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Python: $(python --version)"

          failed=()
          # Install each npm workspace root exactly once. A workspace root installs
          # its child grammar packages and creates local symlinks; installing those
          # children independently races with npm and fails with EEXIST/MODULE_NOT_FOUND.
          mapfile -d '' manifests < <(
            while IFS= read -r -d '' manifest; do
              dir_path="$(dirname "$manifest")"
              ancestor="$(dirname "$dir_path")"
              workspace_managed=false
              while [[ "$ancestor" == grammars/* ]]; do
                parent_manifest="$GITHUB_WORKSPACE/$ancestor/package.json"
                if [[ -f "$parent_manifest" ]] && node -e 'const p=require(process.argv[1]); process.exit(p.workspaces ? 0 : 1)' "$parent_manifest"; then
                  workspace_managed=true
                  break
                fi
                next_ancestor="$(dirname "$ancestor")"
                [[ "$next_ancestor" == "$ancestor" ]] && break
                ancestor="$next_ancestor"
              done
              if [[ "$workspace_managed" == false ]]; then
                printf '%s\0' "$manifest"
              else
                echo "::notice::Skipping workspace child package $dir_path; installed by $ancestor" >&2
              fi
            done < <(find grammars -mindepth 2 -maxdepth 3 -type f -name package.json ! -path 'grammars/asm/*' ! -path 'grammars/*/test-npm-package/*' -print0 | sort -z)
          )

          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No grammar package.json files were found under grammars/"
            exit 1
          fi

          # Grammar packages are independent; bound parallel installs to
          # reduce serial network latency without overloading the hosted runner.
          failed_file="$(mktemp)"
          export failed_file
          install_grammar() {
            local config_path="$1"
            local dir_path
            dir_path="$(dirname "$config_path")"
            echo "::group::📦 Installing grammar dependencies: $dir_path"
            local attempt=1
            local max_attempts=4
            while (( attempt <= max_attempts )); do
              if (cd "$dir_path" && npm install --legacy-peer-deps --no-audit --no-fund); then
                echo "::endgroup::"
                return 0
              fi
              if (( attempt < max_attempts )); then
                local delay=$((attempt * 15))
                echo "::warning::npm install failed for $dir_path (attempt $attempt/$max_attempts); retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            echo "::endgroup::"
            printf '%s\n' "$dir_path" >> "$failed_file"
            return 1
          }
          export -f install_grammar
          if ! printf '%s\0' "${manifests[@]}" | xargs -0 -r -n 1 -P 4 bash -c 'install_grammar "$1"' _; then
            echo "One or more grammar dependency installations failed."
          fi
          if [[ -s "$failed_file" ]]; then
            mapfile -t failed < "$failed_file"
            printf '\n::error::Dependency installation failed for %d grammar(s):\n' "${#failed[@]}"
            printf ' - %s\n' "${failed[@]}"
            rm -f "$failed_file"
            exit 1
          fi
          rm -f "$failed_file"
          echo "✅ Installed dependencies for all ${#manifests[@]} grammar packages."
          

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Generate Java grammar ABI 15
        run: ./gradlew generateJavaGrammarAbi15 --no-daemon --stacktrace

      - name: Build all projects and release variants
        run: |
          ./gradlew clean build \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Upload android-tree-sitter lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tree-sitter-lint-reports
          path: |
            android-tree-sitter/build/reports/lint-results-debug.html
            android-tree-sitter/build/reports/lint-results-debug.xml
            android-tree-sitter/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish all configured Maven modules to local staging repository
        run: |
          ./gradlew publishToMavenLocal \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Verify all 60 Maven publications and artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$HOME/.m2/repository/$MAVEN_GROUP_PATH"
          modules=(
            annotations android-tree-sitter
            tree-sitter-aidl tree-sitter-arm64 tree-sitter-asciidoc
            tree-sitter-asm tree-sitter-bash tree-sitter-c tree-sitter-cmake
            tree-sitter-containerfile tree-sitter-cpp tree-sitter-csharp
            tree-sitter-csv tree-sitter-dart tree-sitter-diff
            tree-sitter-disassembly tree-sitter-dockerfile tree-sitter-gdb
            tree-sitter-git_rebase tree-sitter-gitattributes
            tree-sitter-gitcommit tree-sitter-gitignore tree-sitter-go
            tree-sitter-gomod tree-sitter-graphql tree-sitter-groovy
            tree-sitter-ini tree-sitter-java tree-sitter-javascript
            tree-sitter-jsdoc tree-sitter-json tree-sitter-kotlin
            tree-sitter-llvm tree-sitter-llvm_mir tree-sitter-logcat
            tree-sitter-lua tree-sitter-make tree-sitter-markdwon
            tree-sitter-php tree-sitter-properties tree-sitter-proto
            tree-sitter-python tree-sitter-regex tree-sitter-requirements
            tree-sitter-rst tree-sitter-ruby tree-sitter-rust tree-sitter-scss
            tree-sitter-smali tree-sitter-sql tree-sitter-ssh
            tree-sitter-starlark tree-sitter-svelte tree-sitter-swift
            tree-sitter-toml tree-sitter-typescript tree-sitter-vue
            tree-sitter-xml tree-sitter-yaml tree-sitter-zsh
          )

          if [[ "${#modules[@]}" -ne 60 ]]; then
            echo "::error::Expected 60 modules, found ${#modules[@]}"
            exit 1
          fi

          missing=0
          for module in "${modules[@]}"; do
            artifact_dir="$repo/$module/$VERSION"
            pom="$artifact_dir/$module-$VERSION.pom"
            if [[ ! -s "$pom" ]]; then
              echo "::error::Missing Maven POM: $pom"
              missing=$((missing + 1))
              continue
            fi
            if [[ ! -s "$artifact_dir/$module-$VERSION.aar" && ! -s "$artifact_dir/$module-$VERSION.jar" ]]; then
              echo "::error::Missing AAR/JAR for $module"
              missing=$((missing + 1))
              continue
            fi
            echo "Verified: $module"
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::$missing of 60 modules failed artifact verification"
            exit 1
          fi
          echo "All 60 modules produced POM and AAR/JAR artifacts."

      - name: Create and push JitPack release tag
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}")"
          if [[ -n "$remote_tag" ]]; then
            peeled_commit="$(printf '%s\n' "$remote_tag" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [[ -z "$peeled_commit" ]]; then
              peeled_commit="$(printf '%s\n' "$remote_tag" | awk 'NR == 1 { print $1 }')"
            fi
            current_commit="$(git rev-parse HEAD)"
            if [[ "$peeled_commit" != "$current_commit" ]]; then
              echo "::error::Existing tag $RELEASE_VERSION points to $peeled_commit, not $current_commit"
              exit 1
            fi
            echo "Existing tag already points to the verified build commit; no push needed."
          else
            git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Release summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## JitPack Maven release"
            echo
            printf 'Version/tag: `%s`\n' "$RELEASE_VERSION"
            echo
            echo "- Full Gradle build completed."
            echo "- All 60 configured Maven modules were published to Maven Local."
            echo "- All 60 POMs and AAR/JAR artifacts passed local verification."
            echo "- Release tag pushed; JitPack will build/cache and serve the tagged Maven artifacts."
            echo
            echo "JitPack: https://jitpack.io/#msmt2018/Android-Windbell-TreeSitter"
          } >> "$GITHUB_STEP_SUMMARY"

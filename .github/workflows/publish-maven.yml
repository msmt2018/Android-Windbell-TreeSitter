name: Publish Maven to JitPack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven package version and JitPack release tag
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: write

env:
  ANDROID_NDK_REVISION: '29.0.14206865'
  ANDROID_CMAKE_VERSION: '3.31.6'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  MAVEN_GROUP_PATH: com/github/msmt2018/Android-Windbell-TreeSitter

jobs:
  publish:
    name: Build and publish all Maven modules to JitPack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid Maven release version: $RELEASE_VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag $RELEASE_VERSION already exists"
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android NDK, CMake and Build Tools
        timeout-minutes: 90
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not configured"
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "ndk;$ANDROID_NDK_REVISION" \
            "cmake;$ANDROID_CMAKE_VERSION" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

          ndk_path="$sdk_root/ndk/$ANDROID_NDK_REVISION"
          ndk_revision="$(sed -n 's/^Pkg.Revision = //p' "$ndk_path/source.properties" | head -n 1)"
          if [[ "$ndk_revision" != "$ANDROID_NDK_REVISION" ]]; then
            echo "::error::Expected NDK $ANDROID_NDK_REVISION, received $ndk_revision"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
          echo "$sdk_root/cmake/$ANDROID_CMAKE_VERSION/bin" >> "$GITHUB_PATH"
          "$sdk_root/cmake/$ANDROID_CMAKE_VERSION/bin/cmake" --version
          "$sdk_root/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" version

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cargo nodejs npm ninja-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install grammar runtime dependencies
        timeout-minutes: 30
        run: |
          npm install --prefix grammars/cpp
          npm install --prefix grammars/starlark --ignore-scripts --omit=dev

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Generate Java grammar ABI 15
        run: ./gradlew generateJavaGrammarAbi15 --no-daemon --stacktrace

      - name: Build all projects and release variants
        run: |
          ./gradlew clean build \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Publish all configured Maven modules to local staging repository
        run: |
          ./gradlew publishToMavenLocal \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Verify all 60 Maven publications and artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$HOME/.m2/repository/$MAVEN_GROUP_PATH"
          modules=(
            annotations android-tree-sitter
            tree-sitter-aidl tree-sitter-arm64 tree-sitter-asciidoc
            tree-sitter-asm tree-sitter-bash tree-sitter-c tree-sitter-cmake
            tree-sitter-containerfile tree-sitter-cpp tree-sitter-csharp
            tree-sitter-csv tree-sitter-dart tree-sitter-diff
            tree-sitter-disassembly tree-sitter-dockerfile tree-sitter-gdb
            tree-sitter-git_rebase tree-sitter-gitattributes
            tree-sitter-gitcommit tree-sitter-gitignore tree-sitter-go
            tree-sitter-gomod tree-sitter-graphql tree-sitter-groovy
            tree-sitter-ini tree-sitter-java tree-sitter-javascript
            tree-sitter-jsdoc tree-sitter-json tree-sitter-kotlin
            tree-sitter-llvm tree-sitter-llvm_mir tree-sitter-logcat
            tree-sitter-lua tree-sitter-make tree-sitter-markdwon
            tree-sitter-php tree-sitter-properties tree-sitter-proto
            tree-sitter-python tree-sitter-regex tree-sitter-requirements
            tree-sitter-rst tree-sitter-ruby tree-sitter-rust tree-sitter-scss
            tree-sitter-smali tree-sitter-sql tree-sitter-ssh
            tree-sitter-starlark tree-sitter-svelte tree-sitter-swift
            tree-sitter-toml tree-sitter-typescript tree-sitter-vue
            tree-sitter-xml tree-sitter-yaml tree-sitter-zsh
          )

          if [[ "${#modules[@]}" -ne 60 ]]; then
            echo "::error::Expected 60 modules, found ${#modules[@]}"
            exit 1
          fi

          missing=0
          for module in "${modules[@]}"; do
            artifact_dir="$repo/$module/$VERSION"
            pom="$artifact_dir/$module-$VERSION.pom"
            if [[ ! -s "$pom" ]]; then
              echo "::error::Missing Maven POM: $pom"
              missing=$((missing + 1))
              continue
            fi
            if [[ ! -s "$artifact_dir/$module-$VERSION.aar" && ! -s "$artifact_dir/$module-$VERSION.jar" ]]; then
              echo "::error::Missing AAR/JAR for $module"
              missing=$((missing + 1))
              continue
            fi
            echo "Verified: $module"
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::$missing of 60 modules failed artifact verification"
            exit 1
          fi
          echo "All 60 modules produced POM and AAR/JAR artifacts."

      - name: Create and push JitPack release tag
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Release summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## JitPack Maven release"
            echo
            printf 'Version/tag: `%s`\n' "$RELEASE_VERSION"
            echo
            echo "- Full Gradle build completed."
            echo "- All 60 configured Maven modules were published to Maven Local."
            echo "- All 60 POMs and AAR/JAR artifacts passed local verification."
            echo "- Release tag pushed; JitPack will build/cache and serve the tagged Maven artifacts."
            echo
            echo "JitPack: https://jitpack.io/#msmt2018/Android-Windbell-TreeSitter"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release to JitPack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release tag (defaults to UTC date plus current commit hash)
        required: false
        type: string

permissions:
  contents: write

env:
  BUILD_JAVA_VERSION: "17"

jobs:
  build_release:
    name: Build all Maven release modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install Android CMake and Build Tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then sdkmanager_bin="$candidate"; break; fi
            done
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 1
          fi
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --install "cmake;3.31.6" "build-tools;35.0.0"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cargo cmake ninja-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install grammar runtime dependencies
        run: |
          npm install --prefix grammars/cpp
          npm install --prefix grammars/starlark --ignore-scripts --omit=dev

      - name: Generate Java grammar ABI 15
        run: bash scripts/generate-java-grammar-abi15.sh

      - name: Build all release modules
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew clean build --parallel --no-daemon --stacktrace

      - name: Verify all Maven publications can be created locally
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew publishToMavenLocal --parallel --no-daemon --stacktrace

  tag_release:
    name: Publish successful build through JitPack tag
    runs-on: ubuntu-latest
    needs: build_release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release tag
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          release_version="${REQUESTED_VERSION:-$(date -u +%Y%m%d)-$short_sha}"

          if [[ ! "$release_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid release version: $release_version"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$release_version" >/dev/null 2>&1; then
            echo "::error::Tag $release_version already exists. Choose a new version."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_version" -m "Release $release_version"
          git push origin "refs/tags/$release_version"

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "JitPack release tag created after successful build: $release_version"

      - name: Publish instructions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## JitPack release"
            echo
            printf 'Tag: `%s`\n' "$RELEASE_VERSION"
            echo
            echo "## Build and publication sequence"
            echo
            echo "1. All configured Maven modules passed the Gradle build."
            echo "2. All configured Maven publications were generated in Maven Local."
            echo "3. The release tag was pushed. JitPack will build/cache the tagged modules on demand."
            echo
            echo "JitPack is the Maven distribution endpoint; this workflow does not upload to GitHub Packages."
            echo
            echo "Repository: https://jitpack.io/#msmt2018/Android-Windbell-TreeSitter"
            echo
            printf 'Core library: `com.github.msmt2018.Android-Windbell-TreeSitter:android-tree-sitter:%s`\n' "$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

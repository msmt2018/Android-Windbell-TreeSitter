name: Publish to JitPack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (use auto for yyyyMMdd-<7-character commit hash>)
        required: true
        default: auto
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create JitPack release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$INPUT_VERSION" == "auto" ]]; then
            version="$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid release tag: $version"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists. Use a new version."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "refs/tags/$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "$VERSION" --generate-notes

      - name: Publish instructions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## JitPack release created"
            echo
            echo "- Version: `$VERSION`"
            echo "- JitPack build: https://jitpack.io/#msmt2018/Android-Windbell-TreeSitter/$VERSION"
            echo "- Multi-module coordinates: `com.github.msmt2018.Android-Windbell-TreeSitter:<module>:$VERSION`"
            echo
            echo "JitPack builds and caches artifacts from this Git tag on demand; this workflow does not upload Maven packages."
          } >> "$GITHUB_STEP_SUMMARY"

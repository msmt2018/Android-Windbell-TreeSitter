name: Build and test

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "dev", "main", "fix/tsh-core-architecture" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

env:
  # Build configuration
  BUILD_JAVA_VERSION: '17'
  BUILD_JAVA_DIST: 'temurin'

  DEBUG_INFO_PATH: '**/build/debug-symbols/**/*.debug_info'

  # APT
  ATS_SUDO: sudo
  ATS_APT_UPDATE: apt-get update
  ATS_APT_UPGRADE: apt-get upgrade -y
  ATS_APT_INSTALL: apt-get install
  ATS_APT_DEPS: build-essential cargo nodejs cmake ninja-build

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      # - name: Sync and Update Submodules
        # run: |
          # # 必须先进行多线程深度初始化，在本地把所有嵌套子模块的“坑位”和追踪关系建立好
          # git submodule update --init --recursive --progress --recommend-shallow --jobs 15
          
          # #  建立好追踪关系后，再同步 URL 配置
          # git submodule sync --recursive
          
          # # 最后强行将所有已初始化的子模块更新到远程最新状态
          # git submodule update --remote --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies
        run: $ATS_SUDO $ATS_APT_UPDATE && $ATS_SUDO $ATS_APT_UPGRADE && $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Set up Python for native grammar builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for native grammar bindings
        uses: actions/setup-node@v4
        with:
          # tree-sitter@0.25 pulls node-gyp@13 / undici@8, which require Node >=22.19.
          node-version: '22.22.2'
      - name: Install Node packages for all grammar submodules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Python: $(python --version)"

          failed=()
          mapfile -d '' manifests < <(find grammars -mindepth 2 -maxdepth 3 -type f -name package.json -print0 | sort -z)

          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No grammar package.json files were found under grammars/"
            exit 1
          fi

          for config_path in "${manifests[@]}"; do
            dir_path="$(dirname "$config_path")"
            echo "::group::📦 Installing grammar dependencies: $dir_path"
            # Grammar submodules are independently maintained and some carry
            # stale lockfiles or peer ranges for older tree-sitter runtimes.
            # npm ci rejects lockfile drift; install refreshes the local lockfile.
            # Legacy peer resolution is limited to peer-dependency conflicts and
            # does not suppress native build scripts.
            (cd "$dir_path" && npm install --legacy-peer-deps --no-audit --no-fund) || failed+=("$dir_path")
            echo "::endgroup::"
          done

          if (( ${#failed[@]} > 0 )); then
            printf '\n::error::Dependency installation failed for %d grammar(s):\n' "${#failed[@]}"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi

          echo "✅ Installed dependencies for all ${#manifests[@]} grammar packages."
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Assemble Release
        run: |
          /usr/bin/time -v -o build-release-memory.txt \
            ./gradlew assembleRelease generateDebugSymbolsRelease --parallel --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload generated Kotlin grammar subproject
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-grammar-generated
          path: grammars/kotlin/
          if-no-files-found: error
      - name: Upload build memory usage
        uses: actions/upload-artifact@v4
        with:
          name: build-release-memory
          path: build-release-memory.txt
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: ${{ env.DEBUG_INFO_PATH }}

  unit_test_debug:
    name: Run local tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies
        run: $ATS_SUDO $ATS_APT_UPDATE && $ATS_SUDO $ATS_APT_UPGRADE && $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Set up Python for native grammar builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for native grammar bindings
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Install Node packages for all grammar submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=()
          mapfile -d '' manifests < <(find grammars -mindepth 2 -maxdepth 3 -type f -name package.json -print0 | sort -z)
          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No grammar package.json files were found under grammars/"
            exit 1
          fi
          for config_path in "${manifests[@]}"; do
            dir_path="$(dirname "$config_path")"
            echo "::group::📦 Installing grammar dependencies: $dir_path"
            if [[ -f "$dir_path/package-lock.json" ]]; then
              (cd "$dir_path" && npm ci --no-audit --no-fund) || failed+=("$dir_path")
            else
              (cd "$dir_path" && npm install --no-audit --no-fund) || failed+=("$dir_path")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            printf '\n::error::Dependency installation failed for %d grammar(s):\n' "${#failed[@]}"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "✅ Installed dependencies for all ${#manifests[@]} grammar packages."
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Run debug tests
        run: ./gradlew testDebug --continue --parallel --stacktrace
        env:
          ANDROIDIDE_TEST: true
      - name: Upload Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-tests
          path: '**/build/reports/tests/'

  # Maven and GitHub release publication jobs are intentionally disabled.

name: Build and test

concurrency:
  group: build-and-test-${{ github.ref }}-v2
  cancel-in-progress: true

on:
  push:
    branches: [ "dev", "main", "fix/tsh-core-architecture", "integrate/tsh-unified-api-large-text", "feat/tsh-engine-memory-admission" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

env:
  # Build configuration
  BUILD_JAVA_VERSION: '17'
  BUILD_JAVA_DIST: 'temurin'

  DEBUG_INFO_PATH: '**/build/debug-symbols/**/*.debug_info'

  # APT
  ATS_SUDO: sudo
  ATS_APT_UPDATE: apt-get update
  ATS_APT_INSTALL: apt-get install -y --no-install-recommends
  ATS_APT_DEPS: build-essential cargo nodejs cmake ninja-build

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
          
      # - name: Sync and Update Submodules
        # run: |
          # # 必须先进行多线程深度初始化，在本地把所有嵌套子模块的“坑位”和追踪关系建立好
          # git submodule update --init --recursive --progress --recommend-shallow --jobs 15
          
          # #  建立好追踪关系后，再同步 URL 配置
          # git submodule sync --recursive
          
          # # 最后强行将所有已初始化的子模块更新到远程最新状态
          # git submodule update --remote --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies (retry transient Ubuntu mirror failures)
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local max_attempts=5 attempt=1 delay=10
            while (( attempt <= max_attempts )); do
              if "$@"; then return 0; fi
              if (( attempt == max_attempts )); then
                echo "::error::Command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "::warning::Attempt $attempt/$max_attempts failed; retrying in $delay seconds"
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          retry $ATS_SUDO $ATS_APT_UPDATE
          retry $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Set up Python for native grammar builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for native grammar bindings
        uses: actions/setup-node@v4
        with:
          # tree-sitter@0.25 pulls node-gyp@13 / undici@8, which require Node >=22.19.
          node-version: '22.22.2'
      - name: Set up Bun for grammar packages
        uses: oven-sh/setup-bun@v2
      - name: Install Node packages for all grammar submodules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Python: $(python --version)"

          failed=()
          # Install each npm workspace root exactly once. A workspace root installs
          # its child grammar packages and creates local symlinks; installing those
          # children independently races with npm and fails with EEXIST/MODULE_NOT_FOUND.
          mapfile -d '' manifests < <(
            while IFS= read -r -d '' manifest; do
              dir_path="$(dirname "$manifest")"
              ancestor="$(dirname "$dir_path")"
              workspace_managed=false
              while [[ "$ancestor" == grammars/* ]]; do
                parent_manifest="$GITHUB_WORKSPACE/$ancestor/package.json"
                if [[ -f "$parent_manifest" ]] && node -e 'const p=require(process.argv[1]); process.exit(p.workspaces ? 0 : 1)' "$parent_manifest"; then
                  workspace_managed=true
                  break
                fi
                next_ancestor="$(dirname "$ancestor")"
                [[ "$next_ancestor" == "$ancestor" ]] && break
                ancestor="$next_ancestor"
              done
              if [[ "$workspace_managed" == false ]]; then
                printf '%s\0' "$manifest"
              else
                echo "::notice::Skipping workspace child package $dir_path; installed by $ancestor" >&2
              fi
            done < <(find grammars -mindepth 2 -maxdepth 3 -type f -name package.json ! -path 'grammars/asm/*' ! -path 'grammars/*/test-npm-package/*' -print0 | sort -z)
          )

          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No grammar package.json files were found under grammars/"
            exit 1
          fi

          # Grammar packages are independent; bound parallel installs to
          # reduce serial network latency without overloading the hosted runner.
          failed_file="$(mktemp)"
          export failed_file
          install_grammar() {
            local config_path="$1"
            local dir_path
            dir_path="$(dirname "$config_path")"
            echo "::group::📦 Installing grammar dependencies: $dir_path"
            if (cd "$dir_path" && npm install --legacy-peer-deps --no-audit --no-fund); then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            printf '%s\n' "$dir_path" >> "$failed_file"
            return 1
          }
          export -f install_grammar
          if ! printf '%s\0' "${manifests[@]}" | xargs -0 -r -n 1 -P 4 bash -c 'install_grammar "$1"' _; then
            echo "One or more grammar dependency installations failed."
          fi
          if [[ -s "$failed_file" ]]; then
            mapfile -t failed < "$failed_file"
            printf '\n::error::Dependency installation failed for %d grammar(s):\n' "${#failed[@]}"
            printf ' - %s\n' "${failed[@]}"
            rm -f "$failed_file"
            exit 1
          fi
          rm -f "$failed_file"
          echo "✅ Installed dependencies for all ${#manifests[@]} grammar packages."
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Assemble Release (retry Maven Central rate limits)
        shell: bash
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/gradle-release.log"
          for attempt in 1 2 3 4; do
            status=0
            /usr/bin/time -v -o build-release-memory.txt ./gradlew assembleRelease generateDebugSymbolsRelease --parallel --stacktrace 2>&1 | tee "$log_file" || status=$?
            if (( status == 0 )); then exit 0; fi
            if ! grep -Eqi 'HTTP 429|status code 429|Too Many Requests|Could not GET.*repo\.maven\.apache\.org' "$log_file"; then
              echo "::error::Release build failed for a reason other than Maven Central rate limiting; not retrying."
              exit "$status"
            fi
            if (( attempt == 4 )); then
              echo "::error::Maven Central continued returning HTTP 429 after 4 attempts."
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "::warning::Maven Central rate limited Gradle (attempt $attempt/4); retrying in $delay seconds."
            sleep "$delay"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Upload generated Kotlin grammar subproject
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-grammar-generated
          path: grammars/kotlin/
          if-no-files-found: error
      - name: Upload build memory usage
        uses: actions/upload-artifact@v4
        with:
          name: build-release-memory
          path: build-release-memory.txt
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: ${{ env.DEBUG_INFO_PATH }}

  unit_test_debug:
    name: Run local tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies
        run: $ATS_SUDO $ATS_APT_UPDATE && $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Set up Python for native grammar builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for native grammar bindings
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up Bun for grammar packages
        uses: oven-sh/setup-bun@v2

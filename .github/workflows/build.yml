name: Build and test

on:
  push:
    branches: [ "dev", "main", "migration/tsh-0.28-from-backup-no-largefile" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: { }

env:
  # Build configuration
  BUILD_JAVA_VERSION: '17'
  BUILD_JAVA_DIST: 'temurin'

  DEBUG_INFO_PATH: '**/build/debug-symbols/**/*.debug_info'

  # APT
  ATS_SUDO: sudo
  ATS_APT_UPDATE: apt-get update
  ATS_APT_UPGRADE: apt-get upgrade -y
  ATS_APT_INSTALL: apt-get install
  ATS_APT_DEPS: build-essential cargo nodejs cmake ninja-build

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      # - name: Sync and Update Submodules
        # run: |
          # # 必须先进行多线程深度初始化，在本地把所有嵌套子模块的“坑位”和追踪关系建立好
          # git submodule update --init --recursive --progress --recommend-shallow --jobs 15
          
          # #  建立好追踪关系后，再同步 URL 配置
          # git submodule sync --recursive
          
          # # 最后强行将所有已初始化的子模块更新到远程最新状态
          # git submodule update --remote --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies
        run: $ATS_SUDO $ATS_APT_UPDATE && $ATS_SUDO $ATS_APT_UPGRADE && $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Install Node packages
        run: |
          # 1. 寻找 grammars 目录下所有包含 package.json 的子目录
          # 2. 自动进入每个目录执行 npm install
          find grammars -maxdepth 2 -name "package.json" | while read -r config_path; do
              dir_path=$(dirname "$config_path")
              echo "📦 正在为子模块安装依赖: $dir_path"
              # 使用 () 子 Shell 隔离环境，无需担心 cd 路径错乱，且能支持路径带空格
              (
              cd "$dir_path" || exit 1
             # 优先使用正常安装，如果报错 (&& 后续失败)，则自动执行 || 后面的容错安装
              npm install || {
                   echo "⚠️ 正常安装失败，正在尝试使用 --legacy-peer-deps..."
                   npm install --legacy-peer-deps
                 }
              )
          done
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Assemble Release
        run: |
          /usr/bin/time -v -o build-release-memory.txt \
            ./gradlew assembleRelease generateDebugSymbolsRelease --parallel --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload generated Kotlin grammar subproject
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-grammar-generated
          path: grammars/kotlin/
          if-no-files-found: error
      - name: Upload build memory usage
        uses: actions/upload-artifact@v4
        with:
          name: build-release-memory
          path: build-release-memory.txt
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: ${{ env.DEBUG_INFO_PATH }}

  unit_test_debug:
    name: Run local tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25
      - name: Install dependencies
        run: $ATS_SUDO $ATS_APT_UPDATE && $ATS_SUDO $ATS_APT_UPGRADE && $ATS_SUDO $ATS_APT_INSTALL $ATS_APT_DEPS
      - name: Install Node packages
        run: |
          cd grammars/cpp && npm install && cd -
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Run debug tests
        run: ./gradlew testDebug --continue --parallel --stacktrace
        env:
          ANDROIDIDE_TEST: true
      - name: Upload Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-tests
          path: '**/build/reports/tests/'

  # Maven and GitHub release publication jobs are intentionally disabled.

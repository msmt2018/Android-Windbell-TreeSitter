[versions]
agp = "8.1.1"
incap = "1.0.0"
kotlin = "1.9.22"
kotlin-coroutines = "1.7.3"
javaparser = "3.25.8"
ksp = "1.9.22-1.0.17"
lifecycle = "2.6.2"
navigation = "2.6.0"
room = "2.5.2"
serialization = "1.6.2"
coroutines = "1.7.3"
lsp4j = "1.0.0"

[libraries]
# 核心 UI 与基础库
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.6.1" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }
activity = { module = "androidx.activity:activity-ktx", version = "1.7.2" }
annotation = { module = "androidx.annotation:annotation", version = "1.6.0" }
annotation-experimental = { module = "androidx.annotation:annotation-experimental", version = "1.3.0" }
core = { module = "androidx.core:core-ktx", version = "1.10.1" }
fragment = { module = "androidx.fragment:fragment-ktx", version = "1.6.1" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.3.1" }

# 核心架构组件
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime", version = "2.8.1" }
preference = { module = "androidx.preference:preference-ktx", version = "1.2.1" }

# Kotlin、协程与序列化
common-kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
common-coreLibDesugaring = { module = "com.android.tools:desugar_jdk_libs", version = "2.0.4" }

# 常用基础功能库
material = { module = "com.google.android.material:material", version = "1.9.0" }
google-gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
google-guava = { module = "com.google.guava:guava", version = "32.1.2-android" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.11.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "2.9.0" }

# 解析与语言服务工具
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }
javapoet = { module = "com.squareup:javapoet", version = "1.13.0" }

# 注解处理器辅助
google-auto-service = { module = "com.google.auto.service:auto-service", version = "1.1.1" }
google-auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version = "1.1.1" }
incap = { module = "net.ltgt.gradle.incap:incap", version.ref = "incap" }
incap-processor = { module = "net.ltgt.gradle.incap:incap-processor", version.ref = "incap" }

# 构建脚本依赖
gradle-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# 基础测试依赖
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.1.5" }
androidx-rules = { module = "androidx.test:rules", version = "1.5.0" }
androidx-runner = { module = "androidx.test:runner", version = "1.5.2" }

tests-junit = { module = "junit:junit", version = "4.13.2" }
tests-androidx-ext-junit = { module = "androidx.test.ext:junit", version = "1.1.5" }
tests-androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.5.1" }
tests-mockito = { module = "org.mockito:mockito-core", version = "5.5.0" }

tests-google-truth = { module = "com.google.truth:truth", version = "1.1.5" }
tests-robolectric = { module = "org.robolectric:robolectric", version = "4.10.3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
